<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>@onepagemarket</title>
<style>
  :root { --ink:#0B1220; --dim:#98A2B3; --amber:#BA7517; --bg:#FFFFFF; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif; }
  header { padding:22px 18px 10px; }
  h1 { margin:0; font-size:26px; letter-spacing:-.5px; }
  .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  .rule { height:4px; background:var(--amber); margin:14px 0 0; }
  main { padding:16px 18px 40px; max-width:760px; margin:0 auto; }
  .card { display:block; text-decoration:none; color:inherit; margin-bottom:18px; }
  .card img { width:100%; height:auto; border-radius:12px; border:1px solid #E4E7EC; display:block; }
  .cap { display:block; font-size:13px; color:var(--dim); margin-top:6px; }
  .cap b { color:var(--ink); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .grid .cap { font-size:12px; }
  h2 { font-size:15px; color:var(--dim); font-weight:500; margin:26px 0 12px; }
</style></head>
<body>
<header><h1>@onepagemarket</h1>
<div class="sub">Market cards · auto-published daily · 2026-10-20</div></header>
<div class="rule"></div>
<main>
  <h2>Latest</h2>
  <a class="card big" href="img/winners-losers-20261020.png" target="_blank"><img src="img/winners-losers-20261020.png" loading="lazy" alt="winners-losers-20261020.png"><span class="cap"><b>winners-losers</b> · 2026-10-20</span></a><a class="card big" href="img/week-ahead-20261020.png" target="_blank"><img src="img/week-ahead-20261020.png" loading="lazy" alt="week-ahead-20261020.png"><span class="cap"><b>week-ahead</b> · 2026-10-20</span></a>
  <h2>Archive</h2>
  <div class="grid"><a class="card" href="img/on-deck-20261020.png" target="_blank"><img src="img/on-deck-20261020.png" loading="lazy" alt="on-deck-20261020.png"><span class="cap"><b>on-deck</b> · 2026-10-20</span></a><a class="card" href="img/earnings-week-20261020.png" target="_blank"><img src="img/earnings-week-20261020.png" loading="lazy" alt="earnings-week-20261020.png"><span class="cap"><b>earnings-week</b> · 2026-10-20</span></a><a class="card" href="img/the-close-20261019.png" target="_blank"><img src="img/the-close-20261019.png" loading="lazy" alt="the-close-20261019.png"><span class="cap"><b>the-close</b> · 2026-10-19</span></a></div>
</main>
</body></html>
