name: daily-cards

# 排程基準：全部以「美東 ET」為準（受眾在美國時段）
#                     ET 時間          → 北京 夏令時 / 冬令時   → cron（夏令 / 冬令 UTC）
#   On Deck        08:30（週一~五）     → 20:30 / 21:30          → 12:30 / 13:30 UTC
#   The Close      16:15（週一~五）     → 次日 04:15 / 05:15     → 20:15 / 21:15 UTC
#   Winners&Losers 週五 16:30          → 週六 04:30 / 05:30     → 20:30 / 21:30 UTC（週五）
#   Week Ahead     週一 07:00          → 週一 19:00 / 20:00     → 11:00 / 12:00 UTC
# ⚠️ UTC ≠ 北京時間：UTC+0，北京 UTC+8。UTC 12:30 是北京 20:30。
# 每條產線註冊兩個 UTC 時間（DST / 非 DST 各一），哪一次真的跑由「時區守衛」判定，
# 這樣 3 月 / 11 月換時制時不會整體錯開 1 小時，也不必手動改 cron。
on:
  schedule:
    - cron: '30 12 * * 1-5'   # On Deck  EDT
    - cron: '30 13 * * 1-5'   # On Deck  EST
    - cron: '15 20 * * 1-5'   # The Close EDT
    - cron: '15 21 * * 1-5'   # The Close EST
    - cron: '30 20 * * 5'     # Winners  EDT（週五收盤後）
    - cron: '30 21 * * 5'     # Winners  EST
    - cron: '0 11 * * 1'      # Week Ahead EDT
    - cron: '0 12 * * 1'      # Week Ahead EST
  workflow_dispatch:
    inputs:
      kind:
        description: 'ondeck | theclose | winners | weekahead'
        required: true
        default: 'ondeck'

concurrency:
  group: daily-cards
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 完整歷史：畫廊靠 git log 取每張圖的生成時間

      - name: 決定本次產線
        id: kind
        run: |
          if [ -n "${{ github.event.inputs.kind }}" ]; then
            K="${{ github.event.inputs.kind }}"
          else
            case "${{ github.event.schedule }}" in
              '30 12 * * 1-5'|'30 13 * * 1-5') K=ondeck ;;
              '15 20 * * 1-5'|'15 21 * * 1-5') K=theclose ;;
              '30 20 * * 5'|'30 21 * * 5')     K=winners ;;
              '0 11 * * 1'|'0 12 * * 1')       K=weekahead ;;
              *)                               K=ondeck ;;
            esac
          fi
          echo "kind=$K" >> "$GITHUB_OUTPUT"
          echo "本次產線：$K"

      # 去重守衛 v2（2026-10-29）：舊版「±60 分鐘」窗口在 10-28 被 GitHub cron 延遲 62 分鐘擊穿，
      # On Deck 兩條 cron 全被靜默跳過。改為「寬鬆時間窗 + 當日去重」：
      #   ① 現在必須落在該產線的寬鬆 ET 窗口內（容忍 cron 延遲數小時）；
      #   ② 當天倉庫裡還沒有 "cards: <UTC日期> <kind>" 提交（提交訊息用 UTC 日期，各產線
      #      觸發時 UTC 日期與 ET 日期恆為同一天，所以可直接比對）。
      # 兩條 DST/非 DST cron 重疊觸發時，第二條會因去重命中而跳過，不會重複出卡。
      - name: 去重守衛（當天已出卡則跳過）
        id: guard
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          if os.environ.get('EVENT') == 'workflow_dispatch':
              print('手動觸發 → 跳過守衛')
              open(os.environ['GITHUB_OUTPUT'], 'a').write('run=true\n')
              sys.exit(0)

          KIND = os.environ['KIND']
          # (允許的 ET 星期 0=Mon, 窗口起, 窗口止) —— 分鐘數
          W = {'ondeck':    ([0, 1, 2, 3, 4], 7*60+30,  13*60),      # 目標 08:30，容忍到 13:00
               'theclose':  ([0, 1, 2, 3, 4], 15*60,    19*60+45),   # 目標 16:15
               'winners':   ([4],              15*60+30, 19*60+45),  # 週五，目標 16:30
               'weekahead': ([0],              6*60,     11*60)}     # 週一，目標 07:00
          days, lo, hi = W[KIND]
          now = datetime.now(ZoneInfo('America/New_York'))
          m = now.hour * 60 + now.minute
          inwin = now.weekday() in days and lo <= m <= hi
          print(f"ET 現在 {now:%a %H:%M} · 窗口 {lo//60:02d}:{lo%60:02d}–{hi//60:02d}:{hi%60:02d} → {'在窗內' if inwin else '窗外，跳過'}")
          if not inwin:
              open(os.environ['GITHUB_OUTPUT'], 'a').write('run=false\n')
              sys.exit(0)

          # 去重：當天已有該產線的出卡提交就不再跑
          today = datetime.now(timezone.utc).strftime('%F')
          pat = f"cards: {today} {KIND}"
          hit = subprocess.run(['git', 'log', '--grep', pat, '-1', '--format=%h %s'],
                               capture_output=True, text=True).stdout.strip()
          if hit:
              print(f'今日已出卡（{hit}）→ 跳過')
              ok = 'false'
          else:
              print('今日尚無出卡 → 執行')
              ok = 'true'
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f'run={ok}\n')
          PY

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴（resvg 渲染器 + Pillow）
        if: steps.guard.outputs.run == 'true'
        run: |
          npm ci || npm install
          pip install Pillow

      - name: 寫入推送憑證（可選；未設 secret 則不推手機）
        if: steps.guard.outputs.run == 'true'
        env:
          NOTIFY_ENV: ${{ secrets.NOTIFY_ENV }}
        run: |
          mkdir -p data
          [ -n "$NOTIFY_ENV" ] && printf '%s\n' "$NOTIFY_ENV" > scripts/.env.notify || true
          echo "準備完成（手動發帖模式：不調用 X API）"

      - name: 產圖 + 貼文文案
        if: steps.guard.outputs.run == 'true'
        run: bash scripts/publish.sh "${{ steps.kind.outputs.kind }}"

      - name: 生成畫廊頁
        if: steps.guard.outputs.run == 'true'
        run: python3 scripts/build_gallery.py

      - name: 保存產物（Actions Artifact）
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ steps.kind.outputs.kind }}-${{ github.run_number }}
          path: out/*.png
          retention-days: 30

      - name: 提交回倉庫（GitHub Pages 圖庫 + 歷史累積）
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "onepagemarket-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs out data assets
          if git diff --cached --quiet; then
            echo "無變更"
          else
            git commit -m "cards: $(date -u +%F) ${{ steps.kind.outputs.kind }}"
            # 補跑/排程重疊時遠端會前進，且 docs/index.html 常衝突（兩次運行都改畫廊索引）
            # → rebase 衝突就 abort 後帶 -X theirs 重試（out/docs 都是自動生成物，取哪邊都行）
            ok=""
            for i in 1 2 3; do
              if git pull --rebase -X theirs >/dev/null 2>&1 && git push >/dev/null 2>&1; then ok=1; break; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep 15
            done
            [ -n "$ok" ] || { echo "FATAL: push 3 次失敗"; exit 1; }
          fi
