name: daily-cards

# 排程基準：全部以「美東 ET」為準（受眾在美國時段）
#                     ET 時間          → 北京 夏令時 / 冬令時   → cron（夏令 / 冬令 UTC）
#   On Deck        08:30（週一~五）     → 20:30 / 21:30          → 12:30 / 13:30 UTC
#   The Close      16:15（週一~五）     → 次日 04:15 / 05:15     → 20:15 / 21:15 UTC
#   Winners&Losers 週五 16:30          → 週六 04:30 / 05:30     → 20:30 / 21:30 UTC（週五）
#   Week Ahead     週一 07:00          → 週一 19:00 / 20:00     → 11:00 / 12:00 UTC
# ⚠️ UTC ≠ 北京時間：UTC+0，北京 UTC+8。UTC 12:30 是北京 20:30。
# 每條產線註冊兩個 UTC 時間（DST / 非 DST 各一），哪一次真的跑由「時區守衛」判定，
# 這樣 3 月 / 11 月換時制時不會整體錯開 1 小時，也不必手動改 cron。
on:
  schedule:
    - cron: '30 12 * * 1-5'   # On Deck  EDT
    - cron: '30 13 * * 1-5'   # On Deck  EST
    - cron: '15 20 * * 1-5'   # The Close EDT
    - cron: '15 21 * * 1-5'   # The Close EST
    - cron: '30 20 * * 5'     # Winners  EDT（週五收盤後）
    - cron: '30 21 * * 5'     # Winners  EST
    - cron: '0 11 * * 1'      # Week Ahead EDT
    - cron: '0 12 * * 1'      # Week Ahead EST
  workflow_dispatch:
    inputs:
      kind:
        description: 'ondeck | theclose | winners | weekahead'
        required: true
        default: 'ondeck'

concurrency:
  group: daily-cards
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 決定本次產線
        id: kind
        run: |
          if [ -n "${{ github.event.inputs.kind }}" ]; then
            K="${{ github.event.inputs.kind }}"
          else
            case "${{ github.event.schedule }}" in
              '30 12 * * 1-5'|'30 13 * * 1-5') K=ondeck ;;
              '15 20 * * 1-5'|'15 21 * * 1-5') K=theclose ;;
              '30 20 * * 5'|'30 21 * * 5')     K=winners ;;
              '0 11 * * 1'|'0 12 * * 1')       K=weekahead ;;
              *)                               K=ondeck ;;
            esac
          fi
          echo "kind=$K" >> "$GITHUB_OUTPUT"
          echo "本次產線：$K"

      # ET 是排程的唯一基準。cron 只有 UTC，換時制會差 1 小時，
      # GitHub cron 延遲可達 45 分鐘以上（高峰期），所以放寬到 ±60 分鐘。
      - name: 時區守衛（ET 目標時間 ±60 分鐘）
        id: guard
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os, sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          if os.environ.get('EVENT') == 'workflow_dispatch':
              print('手動觸發 → 跳過守衛')
              open(os.environ['GITHUB_OUTPUT'], 'a').write('run=true\n')
              sys.exit(0)

          KIND = os.environ['KIND']
          # (目標 ET 時分, 允許的 ET 星期 0=Mon)
          T = {'ondeck':    ((8, 30),  [0, 1, 2, 3, 4]),
               'theclose':  ((16, 15), [0, 1, 2, 3, 4]),
               'winners':   ((16, 30), [4]),
               'weekahead': ((7, 0),   [0])}
          (hh, mm), days = T[KIND]
          now = datetime.now(ZoneInfo('America/New_York'))
          delta = abs((now.hour * 60 + now.minute) - (hh * 60 + mm))
          ok = now.weekday() in days and delta <= 60
          print(f"ET 現在 {now:%a %H:%M}（weekday={now.weekday()}）· 目標 {hh:02d}:{mm:02d} · 偏差 {delta} 分 → {'執行' if ok else '跳過'}")
          open(os.environ['GITHUB_OUTPUT'], 'a').write(f'run={"true" if ok else "false"}\n')
          PY

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴（resvg 渲染器）
        if: steps.guard.outputs.run == 'true'
        run: npm ci || npm install

      - name: 寫入推送憑證（可選；未設 secret 則不推手機）
        if: steps.guard.outputs.run == 'true'
        env:
          NOTIFY_ENV: ${{ secrets.NOTIFY_ENV }}
        run: |
          mkdir -p data
          [ -n "$NOTIFY_ENV" ] && printf '%s\n' "$NOTIFY_ENV" > scripts/.env.notify || true
          echo "準備完成（手動發帖模式：不調用 X API）"

      - name: 產圖 + 貼文文案
        if: steps.guard.outputs.run == 'true'
        run: bash scripts/publish.sh "${{ steps.kind.outputs.kind }}"

      - name: 生成畫廊頁
        if: steps.guard.outputs.run == 'true'
        run: python3 scripts/build_gallery.py

      - name: 保存產物（Actions Artifact）
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ steps.kind.outputs.kind }}-${{ github.run_number }}
          path: out/*.png
          retention-days: 30

      - name: 提交回倉庫（GitHub Pages 圖庫 + 歷史累積）
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "onepagemarket-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs out data
          if git diff --cached --quiet; then
            echo "無變更"
          else
            git commit -m "cards: $(date -u +%F) ${{ steps.kind.outputs.kind }}"
            git push
          fi
