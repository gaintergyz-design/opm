name: daily-cards

# 🔴 觸發架構（2026-11-13 阿澤欽定「治本」，詳見 .workbuddy/skills/onepagemarket/SKILL.md §11）：
#   主觸發＝外部定時器打 workflow_dispatch（POST .../daily.yml/dispatches，封裝於 scripts/dispatch_card.sh）。
#   GitHub 的 schedule 是 best-effort：高載時延遲數十分鐘～數小時，甚至直接丟單且不留任何 run 記錄
#   （2026-11-09~12 GitHub 連出多起 Actions critical 事故；11/12 只剩一次遲到約 7 小時的投遞、
#    被守衛判窗外跳過，11/13 掛零，靠人工 dispatch 補圖）。
#   👉 下面 10 條 schedule **只作兜底**，不再是唯一準時來源；外部定時器至少配主/備兩個時間點，
#      靠「當日去重」保證一天只出一張卡。
#
# 時間對照（UTC cron；北京＝UTC+8，美東 ET 冬令 UTC-5 / 夏令 UTC-4）：
#   On Deck        北京 19:07 / 19:40（週一~五） → 11:07 / 11:40 UTC
#   The Close      ET 16:15（週一~五）          → 20:22 / 21:22 + 20:52 / 21:52 UTC
#   Winners&Losers ET 週五 16:30                → 20:30 / 21:30 UTC（週五）
#   Week Ahead     ET 週一 07:00                → 11:00 / 12:00 UTC（週一）
# ⚠️ 週一 11:00 UTC 的 Week Ahead 與 11:07 的 On Deck 前後腳——concurrency 排隊串行，守衛各自判定。
# ⚠️ 不要為了「準時」頻繁改 cron：每次改動都會重新註冊 schedule 並產生數小時空窗。
on:
  schedule:
    - cron: '7 11 * * 1-5'    # On Deck  北京 19:07（避開整點）
    - cron: '40 11 * * 1-5'   # On Deck 兜底
    - cron: '22 20 * * 1-5'   # The Close EDT
    - cron: '22 21 * * 1-5'   # The Close EST
    - cron: '52 20 * * 1-5'   # The Close EDT 兜底
    - cron: '52 21 * * 1-5'   # The Close EST 兜底
    - cron: '30 20 * * 5'     # Winners  EDT（週五收盤後）
    - cron: '30 21 * * 5'     # Winners  EST
    - cron: '0 11 * * 1'      # Week Ahead EDT
    - cron: '0 12 * * 1'      # Week Ahead EST
  workflow_dispatch:
    inputs:
      kind:
        description: 'ondeck | theclose | winners | weekahead'
        required: true
        default: 'ondeck'
      force:
        description: 'true = 忽略當日去重，強制出圖（人工補跑用）'
        required: false
        default: 'false'

concurrency:
  group: daily-cards
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # 完整歷史：去重守衛用 git log --grep 查當天是否已出卡（畫廊已改增量，不再靠它估時間）

      - name: 決定本次產線
        id: kind
        run: |
          if [ -n "${{ github.event.inputs.kind }}" ]; then
            K="${{ github.event.inputs.kind }}"
          else
            case "${{ github.event.schedule }}" in
              '0 11 * * 1-5'|'7 11 * * 1-5'|'40 11 * * 1-5')   K=ondeck ;;
              '15 20 * * 1-5'|'15 21 * * 1-5'|'22 20 * * 1-5'|'22 21 * * 1-5'|'52 20 * * 1-5'|'52 21 * * 1-5') K=theclose ;;
              '30 20 * * 5'|'30 21 * * 5')     K=winners ;;
              '0 11 * * 1'|'0 12 * * 1')       K=weekahead ;;
              *)                               K=ondeck ;;
            esac
          fi
          echo "kind=$K" >> "$GITHUB_OUTPUT"
          echo "本次產線：$K"

      # 守衛 v3（2026-11-13 治本）：
      #   · workflow_dispatch（外部定時器 / 人工補跑）不看時間窗，只做「當日去重」
      #     → 外部定時器可配主/備多個時間點，重複觸發不會重複出卡。
      #   · schedule 僅作兜底，仍檢查寬鬆 ET 窗口（ondeck 已放寬到 ET 19:45，遲到數小時也能補卡）。
      #   · force=true 忽略一切守衛，供人工強制補圖。
      #   去重鍵＝提交訊息 "cards: <UTC日期> <kind>"（checkout fetch-depth: 0 不可拔）。
      - name: 去重守衛（當天已出卡則跳過）
        id: guard
        env:
          KIND: ${{ steps.kind.outputs.kind }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          KIND = os.environ['KIND']
          EVENT = os.environ.get('EVENT', '')
          FORCE = os.environ.get('FORCE') == 'true'

          def out(v, msg):
              print(msg)
              open(os.environ['GITHUB_OUTPUT'], 'a').write(f'run={v}\n')
              sys.exit(0)

          if FORCE:
              out('true', 'force=true → 跳過所有守衛，強制出圖')

          # 外部 dispatch 不檢查時間窗；只有 schedule 兜底需要容忍/限制 ET 窗口
          if EVENT != 'workflow_dispatch':
              W = {'ondeck':    ([0, 1, 2, 3, 4], 5*60+30,  19*60+45),  # 放寬到 ET 19:45
                   'theclose':  ([0, 1, 2, 3, 4], 15*60,    19*60+45),
                   'winners':   ([4],              15*60+30, 19*60+45),
                   'weekahead': ([0],              6*60,     11*60)}
              days, lo, hi = W[KIND]
              now = datetime.now(ZoneInfo('America/New_York'))
              m = now.hour * 60 + now.minute
              inwin = now.weekday() in days and lo <= m <= hi
              print(f"ET 現在 {now:%a %H:%M} · 窗口 {lo//60:02d}:{lo%60:02d}–{hi//60:02d}:{hi%60:02d} → {'在窗內' if inwin else '窗外，跳過'}")
              if not inwin:
                  out('false', 'schedule 落在窗口外 → 跳過')

          # 當日去重：dispatch / schedule 一體適用
          today = datetime.now(timezone.utc).strftime('%F')
          pat = f"cards: {today} {KIND}"
          hit = subprocess.run(['git', 'log', '--grep', pat, '-1', '--format=%h %s'],
                               capture_output=True, text=True).stdout.strip()
          if hit:
              out('false', f'今日已出卡（{hit}）→ 跳過')
          out('true', '今日尚無出卡 → 執行')
          PY

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴（resvg 渲染器 + Pillow）
        if: steps.guard.outputs.run == 'true'
        run: |
          npm ci || npm install
          pip install Pillow

      - name: 寫入推送憑證（可選；未設 secret 則不推手機）
        if: steps.guard.outputs.run == 'true'
        env:
          NOTIFY_ENV: ${{ secrets.NOTIFY_ENV }}
        run: |
          mkdir -p data
          [ -n "$NOTIFY_ENV" ] && printf '%s\n' "$NOTIFY_ENV" > scripts/.env.notify || true
          echo "準備完成（手動發帖模式：不調用 X API）"

      - name: 產圖 + 貼文文案
        if: steps.guard.outputs.run == 'true'
        run: bash scripts/publish.sh "${{ steps.kind.outputs.kind }}"

      - name: 生成畫廊頁
        if: steps.guard.outputs.run == 'true'
        run: python3 scripts/build_gallery.py

      - name: 保存產物（Actions Artifact）
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cards-${{ steps.kind.outputs.kind }}-${{ github.run_number }}
          path: out/*.png
          retention-days: 30

      - name: 提交回倉庫（GitHub Pages 圖庫 + 歷史累積）
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name  "onepagemarket-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs out data assets
          if git diff --cached --quiet; then
            echo "無變更"
          else
            git commit -m "cards: $(date -u +%F) ${{ steps.kind.outputs.kind }}"
            # 補跑/排程重疊時遠端會前進，且 docs/index.html 常衝突（兩次運行都改畫廊索引）
            # → rebase 衝突就 abort 後帶 -X theirs 重試（out/docs 都是自動生成物，取哪邊都行）
            ok=""
            for i in 1 2 3; do
              if git pull --rebase -X theirs >/dev/null 2>&1 && git push >/dev/null 2>&1; then ok=1; break; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep 15
            done
            [ -n "$ok" ] || { echo "FATAL: push 3 次失敗"; exit 1; }
          fi
