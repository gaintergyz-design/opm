name: gallery-sync

# 手動推卡（財報卡 / 專題卡）→ 自動把新卡加進畫廊
#
# 2026-11-12 阿澤欽定「只加新圖」：build_gallery.py 改為增量模式，
#   以 CI 上現有的 docs/index.html 為基底，只插入本次新增的 section，
#   舊卡的時間戳／展開狀態／文案逐字保留，不再整頁重算。
#   沒有新卡時腳本直接結束、不寫檔 → 本 workflow 不會空轉提交。
#
# 觸發：任何 out/*.png 或 caption 變更的 push
# 排除：定時產線自己的提交（作者 onepagemarket-bot）——daily.yml 已自帶 build_gallery，
#       不排除會重複提交、互相 rebase 打架。

on:
  push:
    paths:
      - 'out/*.png'
      - 'out/caption-*.txt'
  workflow_dispatch:
    inputs:
      days:
        description: '可選：預設展開最近 N 天（留空＝3）'
        required: false
        default: ''
      show:
        description: '可選：只渲染最近 N 天（留空＝全部）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: gallery-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'onepagemarket-bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 保留完整歷史以相容 pull --rebase；增量模式已不靠它估時間

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 把新卡加進畫廊（增量）
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.days }}" ] && ARGS="$ARGS --days ${{ github.event.inputs.days }}"
          [ -n "${{ github.event.inputs.show }}" ] && ARGS="$ARGS --show ${{ github.event.inputs.show }}"
          echo "build_gallery.py$ARGS"
          python3 scripts/build_gallery.py $ARGS

      - name: 提交回倉庫
        run: |
          git config user.name  "onepagemarket-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs out/gen-times.json
          if git diff --cached --quiet; then
            echo "無變更"
            exit 0
          fi
          git commit -m "gallery: sync $(date -u +%F)"
          for i in 1 2 3; do
            if git pull --rebase -X theirs >/dev/null 2>&1 && git push >/dev/null 2>&1; then
              echo "pushed"; exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep 10
          done
          echo "FATAL: push 3 次失敗"; exit 1
